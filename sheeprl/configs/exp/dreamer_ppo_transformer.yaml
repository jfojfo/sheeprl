# @package _global_

defaults:
  - override /algo: dreamer_v3_S
  - override /env: atari
  - override /model_manager: dreamer_ppo
  - _self_

exp_name: ${algo.name}_${env.id}

# Algorithm
algo:
  name: dreamer_ppo
  replay_ratio: 1
  total_steps: 5000000
  per_rank_batch_size: 16
  per_rank_sequence_length: 64
  gamma: 0.99
  lmbda: 0.95
  e_clip: 0.2
  cnn_keys:
    encoder: [rgb]
    decoder: [rgb]
  dense_units: 128

  world_model:
    discrete_size: 8
    stochastic_size: 16
    encoder:
      cnn_channels_multiplier: 8
    transformer:
      num_heads: 8
      embed_dim: 128
      dim_feedforward: 512
    transition_model:
      hidden_size: 128
    representation_model:
      hidden_size: 128

# Checkpoint
checkpoint:
  every: 100000

# Buffer
buffer:
  size: 1000000
  checkpoint: False

# Distribution
distribution:
  type: "auto"

metric:
  aggregator:
    metrics:
      Loss/world_model_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/value_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/policy_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/observation_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/reward_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/state_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/continue_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      State/kl:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      State/post_entropy:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      State/prior_entropy:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Grads/world_model:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Grads/actor:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Grads/critic:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Grads/ac:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
